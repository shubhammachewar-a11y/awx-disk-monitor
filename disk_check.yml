---
- name: Disk Utilization Report
  hosts: all
  gather_facts: true

  vars:
    warning_threshold: 80
    critical_threshold: 90

  tasks:

    - name: Initialize disk report
      ansible.builtin.set_fact:
        disk_report: []

    - name: Collect filesystem utilization
      ansible.builtin.set_fact:
        disk_report: "{{ disk_report + [disk_entry] }}"
      vars:
        total_gb: "{{ (item.size_total / 1073741824) | round(2) }}"
        free_gb: "{{ (item.size_available / 1073741824) | round(2) }}"
        used_gb: "{{ ((item.size_total - item.size_available) / 1073741824) | round(2) }}"
        utilization: "{{ (((item.size_total - item.size_available) / item.size_total) * 100) | round(2) }}"

        disk_entry:
          mount: "{{ item.mount }}"
          filesystem: "{{ item.fstype }}"
          total_gb: "{{ total_gb }}"
          used_gb: "{{ used_gb }}"
          free_gb: "{{ free_gb }}"
          utilization: "{{ utilization }}"
          status: >-
            {% if utilization | float >= critical_threshold %}
            CRITICAL
            {% elif utilization | float >= warning_threshold %}
            WARNING
            {% else %}
            NORMAL
            {% endif %}

      loop: "{{ ansible_facts.mounts }}"
      when:
        - item.size_total is defined
        - item.size_available is defined
        - item.size_total | int > 0
        - item.mount is defined

    - name: Display disk report
      ansible.builtin.debug:
        msg: "{{ disk_report }}"

    - name: Send disk report data to AWX
      ansible.builtin.set_stats:
        data:
          server_name: "{{ inventory_hostname }}"
          disk_report: "{{ disk_report }}"
        per_host: true
