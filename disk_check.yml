---
- name: Production Non-Technical Storage Partition Audit
  hosts: all
  gather_facts: yes
  ignore_errors: yes
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

  tasks:
    - name: Initialize metrics array storage
      ansible.builtin.set_fact:
        disk_line: []

    - name: Compile clean layout metrics across all partitions
      ansible.builtin.set_fact:
        disk_line: "{{ disk_line + [ 'Drive Path: ' ~ item.mount ~ '\n  -> Used Space: ' ~ (((item.size_total - item.size_available) / 1024 / 1024 / 1024) | round(2)) ~ ' GB\n  -> Free Space: ' ~ ((item.size_available / 1024 / 1024 / 1024) | round(2)) ~ ' GB\n  -> Total Size: ' ~ ((item.size_total / 1024 / 1024 / 1024) | round(2)) ~ ' GB\n  -> Space Used Percent: ' ~ (((item.size_total - item.size_available) / item.size_total * 100) | round(2)) ~ '%' ] }}"
      loop: "{{ ansible_facts.mounts }}"
      when: item.size_total > 0

    - name: Pass stats context data back to execution engine
      ansible.builtin.set_stats:
        data:
          disk_report: "{{ disk_line }}"
        per_host: true

# This play runs locally on the AWX node using core modules to send the email safely
- name: Dispatch Non-Technical Storage Metrics Report
  hosts: localhost
  gather_facts: no
  vars:
    # ======================================================
    # ENTER YOUR WORKING SMTP PARAMETERS HERE
    # ======================================================
    smtp_server_host: "://wwindia.com"
    smtp_server_port: 25                     
    email_sender: "notifications@wwindia.com" 
    email_recipient: "your-email@wwindia.com" # Put your destination inbox email address here
    # ======================================================

  tasks:
    - name: Generate clean text report body layout
      ansible.builtin.set_fact:
        email_body: |
          Hello Team,

          Please review the automated Storage Capacity Utilization Report summary detailed below:

          ========================================================================
                         SERVER STORAGE CAPACITY AUDIT SUMMARY REPORT
          ========================================================================
          {% for host in groups['all'] %}

          [SERVER NAME: {{ host }}]
          ------------------------------------------------------------------------
          {% if hostvars[host]['disk_report'] is defined %}
          {% for line in hostvars[host]['disk_report'] %}
          {{ line }}
          ------------------------------------------------------------------------
          {% endfor %}
          {% else %}
          Alert: Could not extract storage parameters from this machine. (Server was unreachable or connection timed out).
          ------------------------------------------------------------------------
          {% endif %}
          ========================================================================
          {% endfor %}

          This report was generated automatically. If you require further assistance or full technical logs, please open the central deployment dashboard.

          Best Regards,
          Infrastructure Automation Engine

    - name: Send the clean executive report natively via built-in mail module
      ansible.builtin.mail:
        host: "{{ smtp_server_host }}"
        port: "{{ smtp_server_port }}"
        to: "{{ email_recipient }}"
        from: "{{ email_sender }}"
        subject: "Automated Daily Storage Capacity Summary Report"
        body: "{{ email_body }}"
      delegate_to: localhost
