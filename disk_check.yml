---
- name: Server Disk Utilization Report
  hosts: all
  gather_facts: true

  vars:
    warning_threshold: 80
    critical_threshold: 90

  tasks:

    - name: Create disk utilization report
      ansible.builtin.set_fact:
        disk_report: |
          ============================================================
                 SERVER STORAGE CAPACITY UTILIZATION REPORT
          ============================================================

          Server: {{ inventory_hostname }}

          Partition    Filesystem    Total       Used        Free        Usage     Status
          --------------------------------------------------------------------------------
          {% for disk in ansible_facts.mounts
             if disk.size_total is defined
             and disk.size_available is defined
             and (disk.size_total | int) > 0 %}

          {{ "%-12s" | format(disk.mount) }}
          {{ "%-13s" | format(disk.fstype | default("N/A")) }}
          {{ "%-11s" | format(((disk.size_total / 1073741824) | round(2)) ~ " GB") }}
          {{ "%-11s" | format((((disk.size_total - disk.size_available) / 1073741824) | round(2)) ~ " GB") }}
          {{ "%-11s" | format(((disk.size_available / 1073741824) | round(2)) ~ " GB") }}
          {{ "%-9s" | format((((disk.size_total - disk.size_available) / disk.size_total * 100) | round(2)) ~ "%") }}
          {% set usage = ((disk.size_total - disk.size_available) / disk.size_total * 100) %}
          {% if usage >= critical_threshold %}
          CRITICAL
          {% elif usage >= warning_threshold %}
          WARNING
          {% else %}
          NORMAL
          {% endif %}

          {% endfor %}

          --------------------------------------------------------------------------------

          Threshold:
            NORMAL   : Below {{ warning_threshold }}%
            WARNING  : {{ warning_threshold }}% - {{ critical_threshold - 0.01 }}%
            CRITICAL : {{ critical_threshold }}% and above

          ============================================================
          This report was generated automatically by AWX.
          ============================================================

    - name: Display disk report in AWX job output
      ansible.builtin.debug:
        msg: "{{ disk_report }}"

    - name: Send disk utilization report by email
      ansible.builtin.mail:
        host: "mail.wwindia.com"
        port: 25
        username: "notifications@wwindia.com"
        password: "!@#REWgsd"
        to:
          - "recipient@ex"
        from: "shubham.machewar@ironmountain.com"
        subject: "Storage Capacity Utilization Report - {{ inventory_hostname }}"
        body: "{{ disk_report }}"
        secure: starttls
      delegate_to: localhost
