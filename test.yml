---
- name: Server Disk Utilization Report
  hosts: all
  gather_facts: true

  tasks:

    - name: Get filesystem utilization
      ansible.builtin.command:
        cmd: df -hT
      register: disk_usage
      changed_when: false

    - name: Create disk utilization report
      ansible.builtin.set_fact:
        disk_report: |
          ================================================================
                    SERVER STORAGE CAPACITY UTILIZATION REPORT
          ================================================================

          Server Name : {{ inventory_hostname }}

          {{ disk_usage.stdout }}

          ================================================================
          Report generated automatically by Ansible AWX
          ================================================================

    - name: Display disk report
      ansible.builtin.debug:
        msg: "{{ disk_report }}"

    - name: Save disk report to AWX statistics
      ansible.builtin.set_stats:
        data:
          disk_report: "{{ disk_report }}"
        per_host: false
